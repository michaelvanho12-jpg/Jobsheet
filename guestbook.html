                <th width="10%"><img src="images/gambarheader.png" alt="Header Image" width="100%" height="100%"></th>
            </tr>
            <tr>
                <td align="center" title="Home"><a href="index.html">
                <font color="#000000" size="5">🏠︎</font><br>
                <font face="Verdana"><font color="#000000">Home</font></a></td>
                <td align="center" title="Profile"><a href="profile.html">
                <font color="#000000" size="5">✦</font><br>
                <font face="Verdana"><font color="#000000">Profile</font></a></td>
                <td align="center" title="Gallery"><a href="gallery.html">

                <td align="center" title="Guestbook">
                    <table width="auto">
                        <tr bgcolor="#a69977">
                            <td align="center"><a href="guestbook.html">

        <hr width="100%" size="1px" color="#6e5146">
        <br>
        <h1><font face="Verdana">Terimakasih sudah berkunjung!</font></h1>

        <!-- Bagian form textarea tamu -->

        <form action="guestbook.html#form" method="post">
            <fieldset>
                <legend><font face="Verdana"><strong>Tulis pesan</strong></font></legend>
                <table cellpadding="1" width="50%">
                    <tr>
                        <td><label for="nama"><font face="Verdana">Nama</font></label></td>
                        <td>:<input type="text" id="nama" name="nama" required></td>
                    </tr>
                    <tr>
                        <td><label for="email"><font face="Verdana">Email</font></label></td>
                        <td>:<input type="email" id="email" name="email" required></td>
                    </tr>
                    <tr>
                        <td><label for="Jenis Kelamin"><font face="Verdana">Jenis Kelamin</font></label></td>
                        <td>:<input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan" required><label for="perempuan"><font face="Verdana">Perempuan</font></label></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>:<input type="radio" id="laki-laki" name="jenis_kelamin" value="laki-laki" required><label for="laki-laki"><font face="Verdana">Laki-laki</font></label></td>
                    </tr>
                    <tr>
                        <td><label><font face="Verdana">Pesan</font></label></td>
                        <td>:<textarea id="pesan" name="pesan" rows="6" required></textarea></td>
                    </tr>
                </table>
                <br><input type="reset" name="btn" id="button" value="Reset">
                <input type="submit" name="btn" id="button" value="Submit">
            </fieldset>
        </form>
        <p align="center"><font face="Verdana" size="2px">@ 2026 Michael Vanho Adrian. Hak cipta dilindungi undang-undang.</font></p>
    </body>
</html>
